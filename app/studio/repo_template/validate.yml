name: Validate agent

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: AOP references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python scripts/validate.py
